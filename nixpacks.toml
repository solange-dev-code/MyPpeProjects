# ─── Nixpacks config pour Railway ───
# Build optimisé Python 3.12 + deps système pour WeasyPrint
# Démarre tous les services via supervisord (plan gratuit)

[phases.setup]
nixPkgs = ['python312', 'postgresql_16.lib', 'openssl', 'libffi', 'fontconfig',
           'freetype', 'fribidi', 'harfbuzz', 'libjpeg', 'libpng', 'libtiff',
           'libwebp', 'libxcrypt', 'pango', 'glib', 'gobject-introspection',
           'cairo', 'gdk-pixbuf', 'zlib', 'pkg-config']

aptPkgs = ['libpango-1.0-0', 'libpangoft2-1.0-0', 'libcairo2',
           'libgdk-pixbuf2.0-0', 'shared-mime-info', 'supervisor']

[phases.install]
cmds = [
    'pip install --upgrade pip',
    'pip install -r sanar_admin/requirements.txt',
    'pip install supervisor',
]

[phases.build]
cmds = [
    'cd sanar_admin && python manage.py collectstatic --noinput',
]

[start]
cmd = 'cd sanar_admin && bash start_all.sh'

[variables]
PYTHONUNBUFFERED = '1'
PYTHONDONTWRITEBYTECODE = '1'
DJANGO_DEBUG = 'False'
PORT_WS = '8001'
