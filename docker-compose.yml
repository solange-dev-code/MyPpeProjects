# ─── Docker Compose — Sanar environnement complet ───
# Démarrage : docker-compose up -d
# Logs : docker-compose logs -f backend
# Arrêt : docker-compose down
# Reset complet : docker-compose down -v && docker-compose up -d --build

version: '3.9'

services:
  # ─── Base de données PostgreSQL ───
  db:
    image: postgres:16-alpine
    container_name: sanar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sanar}
      POSTGRES_USER: ${DB_USER:-sanar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sanar_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sanar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Celery broker + Django Channels) ───
  redis:
    image: redis:7-alpine
    container_name: sanar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Backend Django (API REST + interface admin) ───
  backend:
    build:
      context: .
      target: backend
    container_name: sanar_backend
    restart: unless-stopped
    env_file:
      - ./sanar_admin/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./sanar_admin:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
      - ./sanar_admin/logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8080 --workers 4 sanar_admin.wsgi:application"

  # ─── Celery worker (tâches asynchrones) ───
  celery-worker:
    build:
      context: .
      target: celery-worker
    container_name: sanar_celery_worker
    restart: unless-stopped
    env_file:
      - ./sanar_admin/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./sanar_admin:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ─── Celery beat (scheduler planifié) ───
  celery-beat:
    build:
      context: .
      target: celery-beat
    container_name: sanar_celery_beat
    restart: unless-stopped
    env_file:
      - ./sanar_admin/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./sanar_admin:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ─── Serveur TURN (coturn) pour WebRTC NAT traversal ───
  coturn:
    image: coturn/coturn:latest
    container_name: sanar_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49172:49152-49172/udp"
    command: >
      turnserver
      --realm=sanar.app
      --listening-port=3478
      --fingerprint
      --external-ip=${EXTERNAL_IP:-127.0.0.1}
      --user=sanar:sanar123
      --no-cli

volumes:
  postgres_data:
  static_files:
  media_files:
