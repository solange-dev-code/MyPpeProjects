; ─────────────────────────────────────────────────────────────
; Supervisord config — Sanar backend (Railway single-service)
; ─────────────────────────────────────────────────────────────
; Lance les 4 processus dans un seul conteneur Railway :
; 1. gunicorn   — API REST + admin Django (port $PORT)
; 2. daphne     — WebSockets pour WebRTC (port $PORT_WS)
; 3. celery worker — tâches asynchrones (SMS, push, ML)
; 4. celery beat   — tâches planifiées (rappels RDV, RGPD)
;
; Avantages :
; - Plan Railway gratuit (1 seul service)
; - Tous les services démarrent ensemble
; - Redémarrage automatique en cas de crash
;
; Inconvénients :
; - Pas de scaling indépendant (tous partagent le même CPU/RAM)
; - Si un process crash, supervisord le redémarre mais les autres tournent
; ─────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ─── 1. Gunicorn : API REST + admin (port principal $PORT) ───
[program:gunicorn]
command=gunicorn --bind 0.0.0.0:%(ENV_PORT)s --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile - sanar_admin.wsgi:application
directory=/app/sanar_admin
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="sanar_admin.settings"
priority=10

; ─── 2. Daphne : WebSockets WebRTC (port $PORT_WS) ───
; En production, Nginx route /ws/* vers Daphne et le reste vers gunicorn
; Pour Railway sans Nginx, Daphne écoute sur un port séparé
[program:daphne]
command=daphne -b 0.0.0.0 -p %(ENV_PORT_WS)s --access-log - --proxy-headers sanar_admin.asgi:application
directory=/app/sanar_admin
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="sanar_admin.settings"
priority=20

; ─── 3. Celery worker : tâches asynchrones ───
[program:celery-worker]
command=celery -A sanar_admin worker --loglevel=info --concurrency=2 --max-tasks-per-child=100 --without-gossip --without-mingle
directory=/app/sanar_admin
autostart=true
autorestart=true
startsecs=15
startretries=3
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="sanar_admin.settings"
priority=30

; ─── 4. Celery beat : tâches planifiées ───
[program:celery-beat]
command=celery -A sanar_admin beat --loglevel=info
directory=/app/sanar_admin
autostart=true
autorestart=true
startsecs=15
startretries=3
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="sanar_admin.settings"
priority=40
