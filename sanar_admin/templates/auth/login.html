<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanar — Connexion</title>
    <link rel="icon" type="image/png" href="/static/img/logo_sanar_32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1f6c92 0%, #32454e 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white; border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 440px; width: 100%; padding: 48px 40px;
        }
        .logo-section { text-align: center; margin-bottom: 32px; }
        .logo {
            width: 100px; height: 100px; border-radius: 24px;
            margin: 0 auto 16px; display: block;
            box-shadow: 0 8px 24px rgba(31, 108, 146, 0.3);
        }
        .brand { font-size: 32px; font-weight: 800; color: #1f6c92; margin-bottom: 4px; }
        .tagline { font-size: 14px; color: #747b7e; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600;
                color: #32454e; margin-bottom: 6px; }
        input {
            width: 100%; padding: 14px 16px; font-size: 15px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline: none; border-color: #1f6c92;
                      box-shadow: 0 0 0 3px rgba(31, 108, 146, 0.1); }

        .btn-login {
            width: 100%; padding: 16px; font-size: 16px; font-weight: 700;
            color: white; background: #1f6c92; border: none; border-radius: 12px;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #1655a0; }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { background: #acbdc5; cursor: not-allowed; }

        .alert {
            padding: 12px 16px; border-radius: 10px; font-size: 14px;
            margin-bottom: 20px; display: none;
        }
        .alert-error { background: #fef2f2; color: #a25b54; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #529067; border: 1px solid #bbf7d0; }

        .demo-accounts {
            margin-top: 32px; padding: 16px; background: #f8fafc;
            border-radius: 12px; font-size: 12px; color: #747b7e;
        }
        .demo-accounts h4 { color: #32454e; font-size: 13px; margin-bottom: 8px; }
        .demo-accounts .account {
            display: flex; justify-content: space-between;
            padding: 4px 0; border-bottom: 1px solid #e8eaeb;
        }
        .demo-accounts .account:last-child { border-bottom: none; }
        .demo-accounts .role { font-weight: 600; color: #1f6c92; }
        .demo-accounts .credentials { font-family: monospace; color: #32454e; }

        .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #acbdc5; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: white; animation: spin 0.8s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="/static/img/logo_sanar_192.png" alt="Sanar" class="logo">
            <div class="brand">Sanar</div>
            <div class="tagline">Votre santé en un clic</div>
        </div>

        <div id="alert" class="alert alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur ou email</label>
                <input type="text" id="username" name="username"
                       placeholder="admin ou admin@sanar.app" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       placeholder="Votre mot de passe" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-login">
                <span id="btnText">Se connecter</span>
            </button>
        </form>

        <div class="demo-accounts">
            <h4>Comptes de démonstration</h4>
            <div class="account">
                <span class="role">Admin</span>
                <span class="credentials">admin / AdminSanar2026</span>
            </div>
            <div class="account">
                <span class="role">Médecin</span>
                <span class="credentials">dr_demo / Medecin2026!</span>
            </div>
            <div class="account">
                <span class="role">Patient 1</span>
                <span class="credentials">patient_0 / Patient2026!</span>
            </div>
            <div class="account">
                <span class="role">Patient 2</span>
                <span class="credentials">patient_1 / Patient2026!</span>
            </div>
            <div class="account">
                <span class="role">Patient 3</span>
                <span class="credentials">patient_2 / Patient2026!</span>
            </div>
        </div>

        <div class="footer">
            Sanar v2.0 — © 2026
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        const loginForm = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alert');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');

        function showAlert(message, type = 'error') {
            alertDiv.className = 'alert alert-' + type;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
        }

        function hideAlert() { alertDiv.style.display = 'none'; }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btnLogin.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>Connexion...';

            try {
                const response = await fetch(API_BASE + '/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.access) {
                    // Stocker le token
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    if (data.patient) {
                        localStorage.setItem('patient_data', JSON.stringify(data.patient));
                    }

                    showAlert('Connexion réussie ! Redirection...', 'success');

                    // Rediriger selon le rôle
                    setTimeout(() => {
                        if (data.patient) {
                            // Patient → page d'accueil
                            window.location.href = '/';
                        } else if (data.require_2fa) {
                            // Médecin avec 2FA
                            window.location.href = '/2fa/';
                        } else {
                            // Admin ou médecin sans 2FA → admin
                            window.location.href = '/admin/';
                        }
                    }, 1000);
                } else {
                    showAlert(data.error || 'Identifiants incorrects');
                    btnLogin.disabled = false;
                    btnText.textContent = 'Se connecter';
                }
            } catch (error) {
                showAlert('Erreur de connexion au serveur. Vérifiez votre réseau.');
                btnLogin.disabled = false;
                btnText.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
