<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanar Admin - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .logo {
            width: 56px;
            height: 56px;
            background: #2563EB;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 16px;
        }
        .btn-login {
            background: #2563EB;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
        }
        .btn-login:hover { background: #1D4ED8; color: white; }
        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">S</div>
        <h4 class="text-center fw-bold mb-1" style="color:#1e293b;">Sanar Admin</h4>
        <p class="text-center text-muted mb-4" style="font-size:14px;">
            Connectez-vous à votre espace
        </p>

        {% if form.errors %}
        <div class="alert alert-danger" style="font-size:13px;">
            Identifiants incorrects. Veuillez réessayer.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:14px;">
                    Nom d'utilisateur
                </label>
                <input type="text" name="username" class="form-control" 
                       placeholder="admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" style="font-size:14px;">
                    Mot de passe
                </label>
                <input type="password" name="password" class="form-control" 
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Se connecter →</button>
        </form>
    </div>
</body>
</html>
