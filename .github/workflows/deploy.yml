# ─── CD : build & push Docker images sur tag ───
name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à déployer (ex: v2.0.1)'
        required: true
        default: 'v2.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true  # les secrets ne sont pas configurés en CI de test

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            sanar/backend:latest
            sanar/backend:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery worker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: celery-worker
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            sanar/celery-worker:latest
            sanar/celery-worker:${{ steps.version.outputs.tag }}

      - name: Build and push celery beat
        uses: docker/build-push-action@v5
        with:
          context: .
          target: celery-beat
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            sanar/celery-beat:latest
            sanar/celery-beat:${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') }}
